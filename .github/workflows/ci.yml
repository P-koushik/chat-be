name: CI

on:
  push:
    branches:
      - main
      - dev
      - kp/**
      - feat/**
      - fix/**
      - refactor/**
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-format-build:
    name: Lint, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup Bun (instead of Node + npm cache)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # ✅ Install deps via Bun
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ✅ Run your package.json scripts using Bun
      - name: Run ESLint
        run: bun run lint:fix

      - name: Check Prettier formatting
        run: bun run format

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Build project
        run: bun run build

      - name: Run TypeScript type check
        run: bun run typecheck
